# ─── Server ───
server.port=8080

# ─── Database (H2 for dev) ───
spring.datasource.url=jdbc:h2:mem:shopmind;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ─── JPA ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ─── AI Provider Selection ───
# Active AI provider: mock | claude | gemini
# Default is mock (no API key needed). For real AI, set provider=gemini (or claude)
# and supply the matching API key below.
shopmind.ai.provider=${SHOPMIND_AI_PROVIDER:mock}
# Legacy alias — when set to false, defaults provider to gemini if not already set.
shopmind.ai.mock-mode=${SHOPMIND_MOCK_MODE:true}

# ─── Anthropic Claude ───
# Leave the key blank to silently fall back to mock per-call.
shopmind.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
shopmind.ai.claude-model=${CLAUDE_MODEL:claude-haiku-4-5-20251001}

# ─── Google Gemini ───
# Get a key at: https://aistudio.google.com/app/apikey
# Leave blank to silently fall back to mock per-call.
shopmind.ai.gemini-api-key=${GOOGLE_API_KEY:}
shopmind.ai.gemini-model=${GEMINI_MODEL:gemini-2.0-flash}

# ─── Shared LLM tuning ───
shopmind.ai.max-tokens=${LLM_MAX_TOKENS:2048}

# ─── Redis (production) ───
# spring.data.redis.host=${REDIS_HOST:localhost}
# spring.data.redis.port=${REDIS_PORT:6379}

# ─── Shopify ───
shopify.store-domain=${SHOPIFY_STORE_DOMAIN:demo-shoes.myshopify.com}
shopify.storefront-token=${SHOPIFY_STOREFRONT_TOKEN:mock}
shopify.api-version=2026-04

# ─── ShopMind ───
shopmind.ai.mock-mode=${SHOPMIND_MOCK_MODE:true}
shopmind.cache.product-ttl=1800
shopmind.cache.session-ttl=86400
shopmind.cache.recommendation-ttl=3600

# ─── CORS ───
shopmind.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ─── Logging ───
logging.level.com.shopmind=${LOG_LEVEL:INFO}
logging.level.org.springframework.ai=${LOG_LEVEL_AI:WARN}
