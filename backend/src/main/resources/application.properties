# ─── Server ───
server.port=8080

# ─── Database (PostgreSQL) ───
spring.datasource.url=jdbc:postgresql://ep-twilight-lab-aoioxi1w.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_pFcsjrR36miz
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Connection pool (HikariCP) ───
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA ───
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── AI Provider Selection ───
# Active AI provider: mock | groq | gemini
# Default is mock (no API key needed).
shopmind.ai.provider=${SHOPMIND_AI_PROVIDER:groq}

# ─── Groq (recommended — fast, generous free tier) ───
# Get a key at: https://console.groq.com/keys  (free tier: 30 RPM)
# Leave blank to silently fall back to mock per-call.
shopmind.ai.groq-api-key=${GROQ_API_KEY:}
# Model options: llama-3.3-70b-versatile (default), llama3-8b-8192 (faster/cheaper)
shopmind.ai.groq-model=${GROQ_MODEL:llama-3.3-70b-versatile}

# ─── Google Gemini (alternative) ───
# Get a key at: https://aistudio.google.com/app/apikey  (free tier: 15 RPM)
shopmind.ai.gemini-api-key=${GOOGLE_API_KEY:}
shopmind.ai.gemini-model=${GEMINI_MODEL:gemini-2.0-flash}

# ─── Shared LLM tuning ───
shopmind.ai.max-tokens=${LLM_MAX_TOKENS:2048}

# ─── Redis (production) ───
# spring.data.redis.host=${REDIS_HOST:localhost}
# spring.data.redis.port=${REDIS_PORT:6379}

# ─── Shopify ───
shopify.store-domain=${SHOPIFY_STORE_DOMAIN:demo-shoes.myshopify.com}
shopify.storefront-token=${SHOPIFY_STOREFRONT_TOKEN:mock}
shopify.api-version=2026-04

# ─── ShopMind Cache ───
shopmind.cache.product-ttl=1800
shopmind.cache.session-ttl=86400
shopmind.cache.recommendation-ttl=3600

# ─── CORS ───
shopmind.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ─── Logging ───
logging.level.com.shopmind=${LOG_LEVEL:INFO}
logging.level.org.springframework.ai=${LOG_LEVEL_AI:WARN}
